---
layout: default
title: Calendar
---

<m3e-heading variant="display" size="small" emphasized level="1" class="page-title">Upcoming Meetings</m3e-heading>

<div id="calendar-status" class="calendar-status" role="status" aria-live="polite">
    <m3e-loading-indicator variant="contained"></m3e-loading-indicator>
    <span>Loading events…</span>
</div>
<div id="calendar-list" class="stack"></div>

<script>
(function () {
  const CALENDAR_ID = "829beaf6a1d1d7d610cb6905e115c91d1506a005052482f41befc1e302d01810@group.calendar.google.com";
  const API_KEY = "AIzaSyDPIsaBF6bYSH6nyzh_SmO-wtOXVAfLROo";
  const MAX_RESULTS = 10;

  const statusEl = document.getElementById("calendar-status");
  const listEl = document.getElementById("calendar-list");

  const now = new Date().toISOString();
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events` +
    `?key=${API_KEY}&timeMin=${now}&singleEvents=true&orderBy=startTime&maxResults=${MAX_RESULTS}`;

  fetch(url)
    .then((res) => {
      if (!res.ok) throw new Error("Calendar request failed (" + res.status + ")");
      return res.json();
    })
    .then((data) => {
      const events = data.items || [];
      if (events.length === 0) {
        showMessage("event_busy", "No upcoming meetings scheduled.");
        return;
      }
      statusEl.remove();
      events.forEach((event, i) => {
        listEl.appendChild(renderEvent(event, i === 0));
      });
    })
    .catch((err) => {
      console.error("Calendar fetch error:", err);
      showMessage("cloud_off", "Couldn't load the calendar right now.");
    });

  // Swap the loading spinner for an icon + message (empty / error states)
  function showMessage(iconName, text) {
    statusEl.classList.add("calendar-status-empty");
    statusEl.replaceChildren(el("m3e-icon", { name: iconName }), el("span", {}, text));
  }

  function el(tag, attrs, text) {
    const node = document.createElement(tag);
    Object.keys(attrs || {}).forEach((k) => node.setAttribute(k, attrs[k]));
    if (text) node.textContent = text;
    return node;
  }

  function chip(iconName, text) {
    const c = el("m3e-chip");
    c.appendChild(el("m3e-icon", { slot: "icon", name: iconName }));
    c.appendChild(document.createTextNode(text));
    return c;
  }

  function renderEvent(event, isNext) {
    const card = el("m3e-card", { variant: isNext ? "filled" : "elevated" });
    card.className = "event-card" + (isNext ? " event-next" : "");

    const startRaw = event.start.dateTime || event.start.date;
    const isAllDay = !event.start.dateTime;
    const start = new Date(startRaw);

    const dateStr = start.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    });
    const timeStr = isAllDay
      ? "All day"
      : start.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

    const body = el("div", { slot: "content" });
    body.appendChild(el("span", { class: "event-date" }, isNext ? "Next up · " + dateStr : dateStr));
    body.appendChild(el("m3e-heading", { variant: "headline", size: "small", level: "2" }, event.summary || "Untitled event"));

    const chips = el("m3e-chip-set", { role: "group", "aria-label": "Event details" });
    chips.appendChild(chip("schedule", timeStr));
    if (event.location) chips.appendChild(chip("location_on", event.location));
    body.appendChild(chips);

    if (event.description) body.appendChild(el("p", { class: "event-desc" }, event.description));

    card.appendChild(body);
    return card;
  }
})();
</script>
