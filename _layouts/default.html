<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% if page.title %}{{ page.title }} - EMS Programming Club{% else %}Earl Marriott Computer Science Club{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}

    <!-- Paint the right surface colour before the components load (no white flash in dark mode) -->
    <style>
        html { background: #f8f9ff; color-scheme: light dark; }
        @media (prefers-color-scheme: dark) { html { background: #0d141b; } }
        html[data-scheme="light"] { background: #f8f9ff; color-scheme: light; }
        html[data-scheme="dark"] { background: #0d141b; color-scheme: dark; }
        m3e-theme:not(:defined) { display: block; opacity: 0; }
    </style>
    <noscript><style>m3e-theme:not(:defined) { opacity: 1 !important; }</style></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap">
    <link rel="stylesheet" href="/style.css?v={{ site.time | date: '%s' }}">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f8f9ff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d141b" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="/earl-mariott-programming-club-logo.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- Material 3 Expressive (bundled from @m3e/web, see m3e-build/) -->
    <script type="module" src="/assets/m3e.js?v={{ site.time | date: '%s' }}"></script>
</head>
<body>
<m3e-theme id="theme" color="#4492d8" variant="vibrant" scheme="auto" motion="expressive" strong-focus>
    <a class="skip-link" href="#content">Skip to content</a>

    <div class="shell-root">
    <header class="topbar">
        <m3e-icon-button class="drawer-toggle" toggle selected aria-label="Show or hide navigation">
            <m3e-drawer-toggle for="app-drawer"></m3e-drawer-toggle>
            <m3e-icon name="menu"></m3e-icon>
            <m3e-icon slot="selected" name="menu_open"></m3e-icon>
        </m3e-icon-button>
        <a class="app-bar-brand" href="/index.html">
            <img src="/earl-mariott-programming-club-logo.svg" alt="" width="30" height="30">
            <span>Earl Marriott Programming Club</span>
        </a>
    </header>

    <m3e-drawer-container id="shell" class="app" start-mode="auto" start>
        <!-- Side navigation -->
        <nav slot="start" id="app-drawer" class="drawer" aria-label="Primary">
            <m3e-list class="drawer-nav">
                <m3e-list-action href="/index.html" class="drawer-item{% if page.url == '/' or page.url == '/index.html' %} is-active{% endif %}"{% if page.url == '/' or page.url == '/index.html' %} aria-current="page"{% endif %}>
                    <m3e-icon slot="leading" name="home"></m3e-icon>Home
                </m3e-list-action>
                <m3e-list-action href="/achievements.html" class="drawer-item{% if page.url == '/achievements.html' %} is-active{% endif %}"{% if page.url == '/achievements.html' %} aria-current="page"{% endif %}>
                    <m3e-icon slot="leading" name="trophy"></m3e-icon>Achievements
                </m3e-list-action>
                <m3e-list-action href="/blogs.html" class="drawer-item{% if page.url == '/blogs.html' or page.layout == 'post' %} is-active{% endif %}"{% if page.url == '/blogs.html' or page.layout == 'post' %} aria-current="page"{% endif %}>
                    <m3e-icon slot="leading" name="article"></m3e-icon>Blogs
                </m3e-list-action>
                <m3e-list-action href="/calendar.html" class="drawer-item{% if page.url == '/calendar.html' %} is-active{% endif %}"{% if page.url == '/calendar.html' %} aria-current="page"{% endif %}>
                    <m3e-icon slot="leading" name="calendar_month"></m3e-icon>Calendar
                </m3e-list-action>
                <m3e-list-action href="/projects.html" class="drawer-item{% if page.url == '/projects.html' %} is-active{% endif %}"{% if page.url == '/projects.html' %} aria-current="page"{% endif %}>
                    <m3e-icon slot="leading" name="folder_code"></m3e-icon>Projects
                </m3e-list-action>
                <m3e-list-action id="nav-admin" href="/admin.html" class="drawer-item{% if page.url == '/admin.html' %} is-active{% endif %}" hidden>
                    <m3e-icon slot="leading" name="person"></m3e-icon>Announcements
                </m3e-list-action>
                <m3e-list-action href="/about.html" class="drawer-item{% if page.url == '/about.html' %} is-active{% endif %}"{% if page.url == '/about.html' %} aria-current="page"{% endif %}>
                    <m3e-icon slot="leading" name="info"></m3e-icon>About
                </m3e-list-action>
            </m3e-list>

            <div class="drawer-spacer"></div>

            <footer class="drawer-foot">
                <!-- An ode to our friend Connor: the legendary Free V-Bucks button lives
                     on here in spirit (and in the source) forever. Never forget.
                <m3e-button id="vbucks" class="drawer-vbucks" variant="tertiary-container" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                    <m3e-icon slot="icon" name="redeem"></m3e-icon>
                    Free V-Bucks!!!
                </m3e-button>
                -->
                <div class="drawer-actions">
                    <m3e-button class="drawer-github" variant="tonal" href="https://github.com/ems-programming-club" target="_blank" rel="noopener">
                        <svg slot="icon" class="drawer-github-icon" viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
                        </svg>
                        GitHub
                    </m3e-button>
                    <m3e-button class="drawer-discord" variant="tonal" href="https://discord.gg/mhJJZYWNjT" target="_blank" rel="noopener">
                        <svg slot="icon" class="drawer-discord-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                            <path d="M20.317 4.3698a19.7913 19.7913 0 0 0-4.8851-1.5152.0741.0741 0 0 0-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 0 0-.0785-.037 19.7363 19.7363 0 0 0-4.8852 1.515.0699.0699 0 0 0-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 0 0 .0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 0 0 .0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 0 0-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 0 1-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 0 1 .0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 0 1 .0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 0 1-.0066.1276 12.2986 12.2986 0 0 1-1.873.8914.0766.0766 0 0 0-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 0 0 .0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 0 0 .0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 0 0-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"></path>
                        </svg>
                        Discord
                    </m3e-button>
                    <m3e-icon-button href="/settings.html"{% if page.url == '/settings.html' %} variant="filled"{% endif %} aria-label="Settings" title="Settings">
                        <m3e-icon name="settings"></m3e-icon>
                    </m3e-icon-button>
                </div>
                <!-- THIS IS THE LEGACY OF THE GREAT CONNOR MERRIN (aka Merlin) AND IS TO BE PRESERVED IN THIS SITE UNTIL THE END OF TIME -->
            </footer>
        </nav>

        <!-- Main content -->
        <div class="scroller" id="scroller">
            <main id="content" class="page">
                {{ content }}
            </main>

            <footer class="site-footer">
                <p>&copy; 2026 Earl Marriott Computer Science Club. All rights reserved.</p>
                <p>Follow our progress on GitHub: <a href="https://github.com/ems-programming-club/ems-programming-club.github.io">ems-programming-club.github.io</a></p>
            </footer>
        </div>
    </m3e-drawer-container>
    </div>
</m3e-theme>

<!-- Apply a saved colour scheme/preset before the components upgrade (classic script runs first) -->
<script>
    try {
        var p = localStorage.getItem("emspc-preset");
        if (p && p !== "default") {
            document.documentElement.setAttribute("data-preset", p);
            var themeEl = document.getElementById("theme");
            themeEl.setAttribute("data-preset", p);
            var scheme = p === "latte" ? "light" : "dark";
            document.documentElement.setAttribute("data-scheme", scheme);
            themeEl.setAttribute("scheme", scheme);
        } else {
            var s = localStorage.getItem("emspc-scheme");
            if (s === "light" || s === "dark") {
                document.documentElement.setAttribute("data-scheme", s);
                document.getElementById("theme").setAttribute("scheme", s);
            }
        }
    } catch (e) {}
</script>
<script src="/assets/site.js?v={{ site.time | date: '%s' }}" defer></script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("/service-worker.js")
                .then((reg) => console.log("Service worker registered:", reg.scope))
                .catch((err) => console.error("Service worker registration failed:", err));
        });
    }
</script>
<script type="module" src="/firebase-notifications.js"></script>
</body>
</html>
