---
layout: default
title: Blogs
---

<m3e-heading variant="display" size="small" emphasized level="1" class="page-title">Blogs</m3e-heading>

<div class="stack">
    {% for post in site.posts %}
    <m3e-card variant="elevated" class="post-card">
        <div slot="content">
            <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %d, %Y" }}</time>
            <m3e-heading variant="headline" size="small" level="2">
                <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            </m3e-heading>
            <div class="post-excerpt">{{ post.excerpt }}</div>
        </div>
        <div slot="actions">
            <m3e-button variant="tonal" href="{{ post.url | relative_url }}">
                Read more
                <m3e-icon slot="trailing-icon" name="arrow_forward"></m3e-icon>
            </m3e-button>
        </div>
    </m3e-card>
    {% endfor %}
</div>
